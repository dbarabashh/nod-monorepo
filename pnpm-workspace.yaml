packages:
  - apps/*
  - packages/*

allowBuilds:
  '@fugood/llama.node': false
  '@fugood/whisper.node': false
  electron: true
  electron-winstaller: true
  fs-xattr: true
  macos-alias: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - 'baseline-browser-mapping@2.11.30'
  - 'browserslist@4.29.4'
  - 'caniuse-lite@1.0.30001817'
  - 'core-js-compat@3.51.0'
  - 'electron-to-chromium@1.5.461'
  - 'expo-modules-core@58.0.23'
  - 'expo-modules-jsi@58.0.16'
  - 'expo-modules-macros@0.21.0'
  - '@expo/metro-file-map@58.0.5'
  - '@expo/modules-macros-*'
  - '@expo/package-manager@1.14.2'
  - '@expo/xcpretty@4.4.7'
  - 'listr2@11.3.0'
  - 'node-abi@4.38.0'
  - 'node-releases@2.0.59'
  - '@noxcturnal/noxcturnal-*'
  - 'react-is@19.3.1'
  - 'undici@6.29.1'
  - 'undici@7.30.1'

nodeLinker: hoisted
