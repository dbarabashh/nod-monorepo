  - '@oxc-project/types@0.154.0'
  - rolldown@1.2.14
  - '@rolldown/binding-*'
  - listr2@11.3.0
  - node-abi@4.38.0
  - postcss@8.5.30
  - undici@6.29.1
  - undici@7.30.1

nodeLinker: hoisted
