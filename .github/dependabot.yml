version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      electron:
        patterns:
          - electron
          - '@electron/*'
          - '@electron-forge/*'
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - electron
          - '@electron/*'
          - '@electron-forge/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
