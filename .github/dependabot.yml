version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      automerge:
        patterns:
          - '@automerge/*'
      electron:
        patterns:
          - electron
          - '@electron/*'
          - '@electron-forge/*'
      expo:
        patterns:
          - expo
          - 'expo-*'
          - '@expo/*'
          - react-native
          - 'react-native-*'
          - '@react-native/*'
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - electron
          - '@electron/*'
          - '@electron-forge/*'
          - expo
          - 'expo-*'
          - '@expo/*'
          - '@automerge/*'

  - package-ecosystem: npm
    directory: /apps/desktop/relay/vercel
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
